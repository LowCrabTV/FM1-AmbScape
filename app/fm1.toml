# Nightscape FM's build settings (a fork of AMB-1; the files keep AMB-1's name, amb.fwsc) (fm1-base's tools/build.py: ./build.sh)
name = "AMB"                   # the build's files: amb.fwsc, amb-X.Y.fwsc
id_prefix = "FM-1_7"           # package identity: dev FM-1_700, releases FM-1_7XXYYZZ (as AMB-1 0.9)
usb_manufacturer = "Nightscape"
usb_product = "Nightscape FM-1"   # "FM-1" in it: the tools find it by that
ble = false                    # AMB-1 never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
backup = true                  # the eight pieces over USB (base tools/fm1_backup.py): for the PC's renderer
                               # (tools/amb_render.py), or a copy kept safe
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "Generative ambient music for night drives, on the FM-1"
repo = "https://github.com/LowCrabTV/FM1-AmbScape"
licence = "MPL-2.0"
credits = "A fork of AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "LowCrabTV, after AMB-1 by Charles Vestal"
description = "Nightscape FM turns the M-VAVE FM-1 into generative ambient music for night drives: a fork of AMB-1 by Charles Vestal, inspired by Brian Eno's Music for Airports. It plays itself from the moment it's switched on: breathing voices, soft bells on tape loops of unequal length, a gliding bass and quiet Euclidean percussion, through a tape echo and a plate reverb, with dealt chords and keys, dreams, and a renderer for the computer. Its screen wears the colours of a road at dusk."
tags = ["ambient", "generative", "fm"]
install = "https://github.com/LowCrabTV/FM1-AmbScape"
site = "https://github.com/LowCrabTV/FM1-AmbScape"
screenshot = "docs/img/screen-garden.png"
